<div class="flex min-h-screen flex-col">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">
      <a routerLink="/" class="flex items-center gap-2 text-xl font-bold text-brand-600">
        <span class="grid size-8 place-items-center rounded-lg bg-brand-600 text-white">Q</span>
        Dũng Vô Cáp
      </a>

      <nav class="flex items-center gap-2">
        @if (auth.isLoggedIn()) {
          <a
            routerLink="/review"
            class="mr-2 rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          >
            Ôn tập
          </a>
          <span class="mr-2 hidden text-sm font-medium text-slate-600 sm:inline">
            {{ auth.currentUser()?.username }}
          </span>
          <button
            type="button"
            class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
            (click)="logout()"
          >
            Đăng xuất
          </button>
        } @else {
          <a
            routerLink="/login"
            class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          >
            Đăng nhập
          </a>
          <a
            routerLink="/register"
            class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-700"
          >
            Đăng ký
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
